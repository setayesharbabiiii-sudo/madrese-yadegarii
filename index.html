<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769aa">
<title>دبیرستان یادگاری 💙</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

:root{
 --blue:#1769aa;
 --blue2:#318bd2;
 --light:#eaf5ff;
 --pale:#f5faff;
 --navy:#123858;
 --border:#c8e2f8;
 --white:#fff;
 --shadow:0 8px 25px #174e7714;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Vazirmatn,Tahoma,sans-serif;
 color:var(--navy);
 background:
 radial-gradient(circle at 5% 5%,#d8edff,transparent 30%),
 radial-gradient(circle at 95% 85%,#e3f3ff,transparent 30%),
 #f7fbff;
 min-height:100vh;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

header{
 text-align:center;
 padding:22px 14px 14px;
}

.school-name{
 font-size:clamp(25px,6vw,42px);
 font-weight:900;
 color:var(--blue);
}

.subtitle{
 color:#577b99;
 margin-top:7px;
 line-height:1.9;
}

main{
 width:min(100% - 24px,1000px);
 margin:0 auto 35px;
}

.page{display:none;animation:appear .3s ease}
.page.active{display:block}

@keyframes appear{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:translateY(0)}
}

.panel{
 border:1px solid var(--border);
 border-radius:25px;
 padding:20px;
 background:#ffffffed;
 box-shadow:var(--shadow);
 margin:14px 0;
}

.hero{
 text-align:center;
 padding:30px 18px;
 border-radius:28px;
 border:2px solid #b7d9f5;
 background:linear-gradient(145deg,#e3f2ff,#fff 55%,#d8ebff);
 box-shadow:var(--shadow);
 overflow:hidden;
}

.school-logo{
 display:block;
 width:min(190px,65%);
 max-height:190px;
 height:auto;
 object-fit:contain;
 margin:0 auto 15px;
 filter:drop-shadow(0 5px 9px #1769aa20);
}

.hero h2{
 color:var(--blue);
 font-size:clamp(21px,5vw,29px);
}

.hero p{
 line-height:2.1;
 color:#426681;
}

.primary-btn,.back-btn{
 border:0;
 border-radius:14px;
 padding:12px 20px;
 color:white;
 background:linear-gradient(135deg,#1769aa,#3998e5);
 box-shadow:0 4px 12px #1769aa25;
}

.primary-btn:active,.back-btn:active{transform:scale(.98)}

.back-btn{
 background:#547a9a;
 margin:4px 0 12px;
}

.section-title{
 text-align:center;
 font-size:clamp(19px,4vw,25px);
 margin:12px 0 20px;
 color:var(--blue);
}

.dashboard,.class-grid,.staff-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
}

.tile{
 min-height:140px;
 border-radius:22px;
 border:1px solid var(--border);
 background:linear-gradient(145deg,#fff,#eaf5ff);
 box-shadow:0 5px 17px #174e7710;
 padding:18px 9px;
 text-align:center;
 color:var(--navy);
 transition:transform .2s,box-shadow .2s;
}

.tile:active{transform:scale(.97)}
.tile:hover{box-shadow:0 8px 20px #1769aa20}

.tile .emoji{
 display:block;
 font-size:35px;
 margin-bottom:9px;
}

.tile strong{
 display:block;
 font-size:16px;
 line-height:1.8;
}

.tile small{
 display:block;
 margin-top:7px;
 line-height:1.8;
 color:#527590;
}

.class-tile{min-height:125px}
.math{background:linear-gradient(145deg,#e4f2ff,#c6e4ff);border-color:#9bcdf4}
.science{background:linear-gradient(145deg,#edf7ff,#d5eaff);border-color:#a7d3f4}
.humanities{background:linear-gradient(145deg,#f1f7ff,#dce9fa);border-color:#c0d2ed}

.class-room{
 background:white;
 border-radius:24px;
 border:1px solid var(--border);
 padding:17px;
 box-shadow:var(--shadow);
}

.room-menu{margin-bottom:18px}
.room-menu .tile{min-height:112px;padding:13px 6px}

.item-card{
 background:#f7fbff;
 border:1px solid #d7eafa;
 border-radius:15px;
 padding:13px;
 margin:10px 0;
 line-height:1.9;
 overflow-wrap:anywhere;
}
