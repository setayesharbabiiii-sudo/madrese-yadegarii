<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a68">
<title>دبیرستان یادگاری 🌌</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --navy:#06165d;
  --blue:#1765e8;
  --purple:#7042d7;
  --ink:#14245f;
  --muted:#66708f;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 8% 10%,#d8e7ff,transparent 34%),
    radial-gradient(ellipse at 88% 42%,#eee5ff,transparent 35%),
    linear-gradient(180deg,#f8faff,#f4f6ff);
  min-height:100vh;
}

button,input,textarea {
  font:inherit;
}

button {
  cursor:pointer;
}

a {
  color:inherit;
  text-decoration:none;
}

.hidden {
  display:none!important;
}

.container {
  width:min(1240px,94%);
  margin:auto;
}

/* نوار بالای سایت */

.topbar {
  position:sticky;
  top:8px;
  z-index:20;
  margin:12px auto 0;
  width:96%;
  border-radius:28px;
  background:linear-gradient(105deg,#06124f,#071b70 70%,#092b98);
  color:white;
  box-shadow:0 14px 35px #091b6830;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:175px;
}

.logo {
  width:55px;
  height:55px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 30% 25%,white,#a8d3ff 28%,#2868e8 48%,#140f77 70%,white 73%,#2b61d8 82%);
  border:2px solid #b8d7ff;
  box-shadow:0 0 0 3px #ffffff22;
  font-size:25px;
  font-weight:800;
  color:white;
  text-shadow:0 2px 5px #06165d;
}

.brand strong {
  display:block;
  font-size:16px;
}

.brand small {
  display:block;
  color:#d7e2ff;
  font-size:10px;
  margin-top:3px;
}

.nav {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  flex:1;
  flex-wrap:wrap;
}

.nav button {
  border:0;
  background:transparent;
  color:#e7edff;
  padding:11px 9px;
  border-radius:12px;
  font-size:12px;
}

.nav button:hover,
.nav button.active {
  background:#ffffff12;
  color:#7ec1ff;
  box-shadow:inset 0 -2px #3289ff;
}

.login-link {
  border:1px solid #ffffff30;
  background:#ffffff0c;
  color:white;
  border-radius:22px;
  padding:10px 13px;
  white-space:nowrap;
  font-size:12px;
}

/* صفحه ورود */

.entry-screen {
  position:fixed;
  inset:0;
  z-index:90;
  background:
    radial-gradient(circle at 15% 20%,#d7e7ff,transparent 35%),
    linear-gradient(135deg,#f8faff,#eeeaff);
  display:grid;
  place-items:center;
  padding:20px;
}

.entry-card {
  width:min(460px,100%);
  padding:35px 25px;
  text-align:center;
  background:#ffffffd9;
  border:1px solid white;
  border-radius:28px;
  box-shadow:0 25px 70px #122e7b20;
}

.entry-card .logo {
  width:90px;
  height:90px;
  margin:0 auto 18px;
  font-size:36px;
}

.entry-card h1 {
  font-size:27px;
  color:#0a2478;
}

.entry-card p {
  font-size:13px;
  line-height:2;
  color:var(--muted);
}

.eyebrow {
  display:inline-block;
  color:var(--purple);
  background:#eee9ff;
  border:1px solid #e0d8ff;
  border-radius:20px;
  padding:7px 13px;
  font-size:12px;
  font-weight:700;
}

/* دکمه‌ها */

.btn {
  border:0;
  border-radius:13px;
  padding:12px 19px;
  font-weight:700;
  font-size:13px;
  transition:.2s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn:hover {
  transform:translateY(-2px);
}

.btn-primary {
  background:linear-gradient(110deg,#1766e9,#092b9d);
  color:white;
  box-shadow:0 9px 20px #1765e833;
}

.btn-outline {
  background:#ffffffb5;
  border:1px solid #9eafe4;
  color:#132a7c;
}

/* بخش خوشامدگویی */

.hero {
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:25px;
  padding:45px 0 28px;
  min-height:390px;
}

.hero-copy {
  padding:20px 8px;
}

.hero h1 {
  font-size:clamp(27px,4vw,43px);
  line-height:1.7;
  margin:13px 0;
  color:#09236f;
  font-weight:800;
}

.gradient-text {
  background:linear-gradient(90deg,#1765e8,#7842cf);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p {
  color:#68718c;
  line-height:2.2;
  font-size:14px;
}

.actions {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:22px;
}

/* تصویر گرافیکی مدرسه */

.hero-art {
  min-height:320px;
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.orbit {
  position:absolute;
  width:320px;
  height:320px;
  border:23px solid #2365ed;
  border-right-color:#b9c8ff;
  border-bottom-color:#7144d9;
  border-radius:50%;
  transform:rotate(-28deg);
  filter:drop-shadow(0 8px 12px #1746c22b);
}

.orbit:before {
  content:"";
  position:absolute;
  inset:-42px;
  border:13px solid #d5defd;
  border-left-color:#3e80ff;
  border-bottom-color:#a89aff;
  border-radius:50%;
}

.school-art {
  position:relative;
  width:min(420px,92%);
  height:245px;
  border-radius:18px 18px 6px 6px;
  background:linear-gradient(150deg,#fff,#e8f0ff);
  box-shadow:0 25px 50px #09236d2b;
  overflow:hidden;
  border:1px solid #d4def8;
}

  height:34px;
  background:
